[package]
name = "tr"
version.workspace = true
edition = "2024"

[features]
default = ["cli"]
# Dependencies only the `tr` binary needs. Library users: `default-features = false`.
cli = ["dep:clap", "dep:colored"]

[dependencies]
rayon.workspace = true
clap = { workspace = true, optional = true }
colored = { workspace = true, optional = true }

[[bin]]
name = "tr"
path = "src/main.rs"
required-features = ["cli"]
